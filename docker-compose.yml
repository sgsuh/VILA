# Usage:
#   docker compose build
#   docker compose run --rm vila                  # interactive shell
#   docker compose run --rm vila vila-infer ...   # one-off command
#   docker compose up vila-server                 # OpenAI-compatible API on :8000

x-vila-common: &vila-common
  image: vila-dev:latest
  gpus: all
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  volumes:
    - .:/workspace/VILA
    - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
  environment:
    VILA_MODEL_PATH: ${VILA_MODEL_PATH:-Efficient-Large-Model/NVILA-Lite-2B}
    VILA_CONV_MODE: ${VILA_CONV_MODE:-auto}
    HF_TOKEN: ${HF_TOKEN:-}

services:
  vila:
    <<: *vila-common
    build:
      context: .
      dockerfile: Dockerfile.dev
    stdin_open: true
    tty: true

  vila-server:
    <<: *vila-common
    ports:
      - "8000:8000"
    command: ["python", "-u", "-W", "ignore", "server.py"]
